name: Product feedback
description: Share an idea, correction, or learning experience.
title: "[Feedback]: "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Oxford 5000 Words. Please do not include passwords, API keys, private progress exports, or other sensitive information.
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: Tell us what you liked, what was confusing, or what you would change.
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Optional context
      description: Include the affected word, feature, browser, or device if relevant.
