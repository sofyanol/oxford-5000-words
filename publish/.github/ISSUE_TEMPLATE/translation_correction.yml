name: Translation or example correction
description: Suggest a correction to a translation, example, pronunciation, or level.
title: "[Language data]: "
labels:
  - language-data
body:
  - type: markdown
    attributes:
      value: |
        Please provide evidence or a clear explanation. Machine-generated translations should be checked by a fluent speaker before formal use.
  - type: input
    id: word
    attributes:
      label: English word or sentence
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Spanish
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested correction
      description: Include a short explanation of the meaning or grammar.
    validations:
      required: true
