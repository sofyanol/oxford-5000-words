<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%" fill="none">
  <defs>
    <filter id="tileShadow" x="-10%" y="-10%" width="125%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Mode 1: Multiple Choice -->
  <g transform="translate(10, 20)" filter="url(#tileShadow)">
    <rect width="210" height="270" rx="18" fill="url(#tileGrad)" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="105" cy="48" r="24" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
    <text x="105" y="55" font-size="22" text-anchor="middle">🎯</text>
    <text x="105" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Multiple-Choice</text>
    <text x="105" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">4 Dynamic Options</text>
    
    <g transform="translate(18, 136)">
      <rect x="0" y="0" width="174" height="24" rx="6" fill="#334155" />
      <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">A. Definition 1</text>
      
      <rect x="0" y="30" width="174" height="24" rx="6" fill="#065f46" stroke="#10b981" />
      <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">B. Correct Meaning ✓</text>
      
      <rect x="0" y="60" width="174" height="24" rx="6" fill="#334155" />
      <text x="12" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">C. Alternative Form</text>

      <rect x="0" y="90" width="174" height="24" rx="6" fill="#334155" />
      <text x="12" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">D. Antonym Option</text>
    </g>
  </g>

  <!-- Mode 2: Audio Listening Quiz -->
  <g transform="translate(240, 20)" filter="url(#tileShadow)">
    <rect width="210" height="270" rx="18" fill="url(#tileGrad)" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="105" cy="48" r="24" fill="#164e63" stroke="#22d3ee" stroke-width="1.5" />
    <text x="105" y="55" font-size="22" text-anchor="middle">🎧</text>
    <text x="105" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Audio Listening</text>
    <text x="105" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">Blind Audio Recall</text>
    
    <g transform="translate(18, 142)">
      <rect x="0" y="0" width="174" height="42" rx="10" fill="#083344" stroke="#0891b2" />
      <text x="87" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#67e8f9" text-anchor="middle">🔊 Listen &amp; Identify</text>
      
      <rect x="0" y="54" width="174" height="60" rx="10" fill="#1e293b" />
      <text x="87" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Headword is masked</text>
      <text x="87" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Trains auditory memory</text>
    </g>
  </g>

  <!-- Mode 3: Speed Race -->
  <g transform="translate(470, 20)" filter="url(#tileShadow)">
    <rect width="210" height="270" rx="18" fill="url(#tileGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="105" cy="48" r="24" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" />
    <text x="105" y="55" font-size="22" text-anchor="middle">🏎️</text>
    <text x="105" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Speed Race Mode</text>
    <text x="105" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">30s Time Attack</text>
    
    <g transform="translate(18, 142)">
      <rect x="0" y="0" width="174" height="38" rx="8" fill="#451a03" stroke="#d97706" />
      <text x="87" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#fde68a" text-anchor="middle">⏱️ 00:28 (+2s)</text>
      
      <rect x="0" y="48" width="174" height="66" rx="8" fill="#1e293b" />
      <text x="87" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">+2s bonus on correct</text>
      <text x="87" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">High Score Leaderboard</text>
    </g>
  </g>

  <!-- Mode 4: Spelling Quiz -->
  <g transform="translate(700, 20)" filter="url(#tileShadow)">
    <rect width="210" height="270" rx="18" fill="url(#tileGrad)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="105" cy="48" r="24" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="105" y="55" font-size="22" text-anchor="middle">✍️</text>
    <text x="105" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Interactive Spelling</text>
    <text x="105" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">Cloze Writing Recall</text>
    
    <g transform="translate(18, 142)">
      <rect x="0" y="0" width="174" height="34" rx="6" fill="#0f172a" stroke="#059669" />
      <text x="14" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#34d399">a_c_e_p_t_a_b_l_e</text>
      
      <rect x="0" y="44" width="174" height="70" rx="8" fill="#1e293b" />
      <text x="87" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Contextual Sentence</text>
      <text x="87" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">Phonetic IPA Clues</text>
    </g>
  </g>
</svg>
