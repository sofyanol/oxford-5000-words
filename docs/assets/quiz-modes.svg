<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Drop Shadows -->
    <filter id="modeShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.08" />
    </filter>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <!-- Top Neon Accent Line Gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- ================= MODE 1: MULTIPLE-CHOICE ================= -->
  <g transform="translate(10, 16)" filter="url(#modeShadow)">
    <rect width="216" height="295" rx="20" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <!-- Top Accent Glow Line -->
    <rect x="20" y="0" width="176" height="3" rx="1.5" fill="url(#accentBlue)" />
    
    <!-- Icon & Header -->
    <circle cx="108" cy="46" r="22" fill="#1e3a8a" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.5" />
    <text x="108" y="53" font-size="20" text-anchor="middle">🎯</text>
    <text x="108" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">Multiple-Choice</text>
    <text x="108" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">4 Dynamic Options</text>
    
    <!-- Options List Mockup -->
    <g transform="translate(16, 128)">
      <!-- Option A -->
      <g transform="translate(0, 0)">
        <rect width="184" height="28" rx="8" fill="#1e293b" stroke="#334155" />
        <rect x="6" y="5" width="18" height="18" rx="5" fill="#334155" />
        <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#94a3b8" text-anchor="middle">A</text>
        <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Formal Agreement</text>
      </g>
      <!-- Option B (Selected Correct) -->
      <g transform="translate(0, 36)">
        <rect width="184" height="32" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
        <rect x="6" y="6" width="20" height="20" rx="5" fill="#10b981" />
        <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
        <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#a7f3d0">Suitable / Pleasing</text>
      </g>
      <!-- Option C -->
      <g transform="translate(0, 76)">
        <rect width="184" height="28" rx="8" fill="#1e293b" stroke="#334155" />
        <rect x="6" y="5" width="18" height="18" rx="5" fill="#334155" />
        <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#94a3b8" text-anchor="middle">C</text>
        <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Refuse or Deny</text>
      </g>
      <!-- Option D -->
      <g transform="translate(0, 112)">
        <rect width="184" height="28" rx="8" fill="#1e293b" stroke="#334155" />
        <rect x="6" y="5" width="18" height="18" rx="5" fill="#334155" />
        <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#94a3b8" text-anchor="middle">D</text>
        <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Unexpected Delay</text>
      </g>
    </g>
  </g>

  <!-- ================= MODE 2: AUDIO LISTENING QUIZ ================= -->
  <g transform="translate(244, 16)" filter="url(#modeShadow)">
    <rect width="216" height="295" rx="20" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <rect x="20" y="0" width="176" height="3" rx="1.5" fill="url(#accentCyan)" />
    
    <circle cx="108" cy="46" r="22" fill="#164e63" fill-opacity="0.5" stroke="#06b6d4" stroke-width="1.5" />
    <text x="108" y="53" font-size="20" text-anchor="middle">🎧</text>
    <text x="108" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">Audio Listening</text>
    <text x="108" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Blind Ear Recall</text>
    
    <!-- Audio Wave Player UI Mockup -->
    <g transform="translate(16, 130)">
      <!-- Interactive Audio Button -->
      <rect width="184" height="46" rx="12" fill="#083344" stroke="#0891b2" stroke-width="1.5" />
      <circle cx="28" cy="23" r="14" fill="#06b6d4" />
      <path d="M25 18 L33 23 L25 28 Z" fill="#ffffff" />
      <text x="50" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#67e8f9">Listen Native Audio</text>
      
      <!-- Waveform equalizer animation lines -->
      <g transform="translate(20, 62)">
        <rect x="0" y="10" width="4" height="20" rx="2" fill="#06b6d4" />
        <rect x="8" y="4" width="4" height="32" rx="2" fill="#22d3ee" />
        <rect x="16" y="14" width="4" height="12" rx="2" fill="#06b6d4" />
        <rect x="24" y="0" width="4" height="40" rx="2" fill="#38bdf8" />
        <rect x="32" y="8" width="4" height="24" rx="2" fill="#22d3ee" />
        <rect x="40" y="18" width="4" height="8" rx="2" fill="#0891b2" />
        <rect x="48" y="2" width="4" height="36" rx="2" fill="#38bdf8" />
        <rect x="56" y="12" width="4" height="16" rx="2" fill="#06b6d4" />
        <rect x="64" y="6" width="4" height="28" rx="2" fill="#22d3ee" />
        <rect x="72" y="16" width="4" height="10" rx="2" fill="#0891b2" />
        <rect x="80" y="2" width="4" height="36" rx="2" fill="#38bdf8" />
        <rect x="88" y="10" width="4" height="20" rx="2" fill="#06b6d4" />
        <rect x="96" y="4" width="4" height="32" rx="2" fill="#22d3ee" />
        <rect x="104" y="14" width="4" height="12" rx="2" fill="#0891b2" />
        <rect x="112" y="8" width="4" height="24" rx="2" fill="#22d3ee" />
        <rect x="120" y="18" width="4" height="8" rx="2" fill="#0891b2" />
        <rect x="128" y="0" width="4" height="40" rx="2" fill="#38bdf8" />
        <rect x="136" y="10" width="4" height="20" rx="2" fill="#06b6d4" />
      </g>

      <!-- Masked Word Box -->
      <g transform="translate(0, 116)">
        <rect width="184" height="28" rx="8" fill="#1e293b" />
        <text x="92" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Headword is Hidden 🔒</text>
      </g>
    </g>
  </g>

  <!-- ================= MODE 3: SPEED RACE ================= -->
  <g transform="translate(478, 16)" filter="url(#modeShadow)">
    <rect width="216" height="295" rx="20" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <rect x="20" y="0" width="176" height="3" rx="1.5" fill="url(#accentAmber)" />
    
    <circle cx="108" cy="46" r="22" fill="#78350f" fill-opacity="0.5" stroke="#f59e0b" stroke-width="1.5" />
    <text x="108" y="53" font-size="20" text-anchor="middle">🏎️</text>
    <text x="108" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">Speed Race Mode</text>
    <text x="108" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">30s Time Attack Challenge</text>
    
    <!-- Speed Attack Mockup -->
    <g transform="translate(16, 130)">
      <!-- Glowing Timer Pill -->
      <rect width="184" height="44" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="28" cy="22" r="13" fill="#f59e0b" />
      <text x="28" y="27" font-size="13" text-anchor="middle">⚡</text>
      <text x="50" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#fde68a">00:28 <tspan fill="#34d399">(+2s bonus)</tspan></text>

      <!-- Combo Multiplier Badge -->
      <g transform="translate(0, 56)">
        <rect width="184" height="40" rx="10" fill="#1e293b" stroke="#d97706" stroke-dasharray="4 3" />
        <text x="92" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#fbbf24" text-anchor="middle">🔥 5x Streak Combo!</text>
      </g>

      <!-- Score Bar -->
      <g transform="translate(0, 108)">
        <rect width="184" height="34" rx="8" fill="#1e293b" />
        <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Score: 420 pts</text>
        <rect x="120" y="7" width="54" height="20" rx="5" fill="#f59e0b" />
        <text x="147" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#451a03" text-anchor="middle">RANK #1</text>
      </g>
    </g>
  </g>

  <!-- ================= MODE 4: INTERACTIVE SPELLING ================= -->
  <g transform="translate(712, 16)" filter="url(#modeShadow)">
    <rect width="216" height="295" rx="20" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <rect x="20" y="0" width="176" height="3" rx="1.5" fill="url(#accentEmerald)" />
    
    <circle cx="108" cy="46" r="22" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="1.5" />
    <text x="108" y="53" font-size="20" text-anchor="middle">✍️</text>
    <text x="108" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">Spelling &amp; Cloze</text>
    <text x="108" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Active Typing Recall</text>
    
    <!-- Spelling Letter Slots Mockup -->
    <g transform="translate(16, 130)">
      <!-- Letter Tiles -->
      <g transform="translate(4, 8)">
        <rect x="0" y="0" width="16" height="24" rx="4" fill="#334155" />
        <text x="8" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">a</text>
        <rect x="20" y="0" width="16" height="24" rx="4" fill="#334155" />
        <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">c</text>
        <rect x="40" y="0" width="16" height="24" rx="4" fill="#334155" />
        <text x="48" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">c</text>
        <rect x="60" y="0" width="16" height="24" rx="4" fill="#334155" />
        <text x="68" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">e</text>
        <rect x="80" y="0" width="16" height="24" rx="4" fill="#334155" />
        <text x="88" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">p</text>
        <rect x="100" y="0" width="16" height="24" rx="4" fill="#334155" />
        <text x="108" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">t</text>
        <!-- Active input slots -->
        <rect x="120" y="0" width="16" height="24" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
        <line x1="128" y1="5" x2="128" y2="19" stroke="#34d399" stroke-width="1.5" />
        <rect x="140" y="0" width="16" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-dasharray="2 2" />
        <rect x="160" y="0" width="16" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-dasharray="2 2" />
      </g>

      <!-- IPA Clue -->
      <g transform="translate(0, 50)">
        <rect width="184" height="38" rx="8" fill="#1e293b" />
        <text x="92" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">IPA: /əkˈsep.tə.bəl/</text>
      </g>

      <!-- Keyboard Assist Pill -->
      <g transform="translate(0, 100)">
        <rect width="184" height="42" rx="8" fill="#064e3b" stroke="#10b981" />
        <text x="92" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#a7f3d0" text-anchor="middle">⌨️ Full Keyboard Support</text>
      </g>
    </g>
  </g>
</svg>
