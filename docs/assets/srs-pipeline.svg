    <rect x="14" y="14" width="32" height="20" rx="6" fill="#064e3b" />
    <text x="30" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#6ee7b7" text-anchor="middle">BOX 5</text>
    <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#10b981">Day 14+</text>
    <text x="14" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#a7f3d0">Permanent</text>
    <text x="14" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#34d399">MASTERED 👑</text>
