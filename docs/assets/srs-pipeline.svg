<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%" fill="none">
  <defs>
    <filter id="boxShadow" x="-10%" y="-10%" width="125%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Box 1 -->
  <g transform="translate(10, 20)" filter="url(#boxShadow)">
    <rect width="155" height="130" rx="14" fill="url(#boxGrad)" stroke="#ef4444" stroke-width="1.5" />
    <rect x="14" y="14" width="32" height="20" rx="6" fill="#7f1d1d" />
    <text x="30" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#fca5a5" text-anchor="middle">BOX 1</text>
    <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Day 1</text>
    <text x="14" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Immediate Recall</text>
    <text x="14" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ef4444">New Words</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M175 85 L195 85 M190 79 L196 85 L190 91" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

