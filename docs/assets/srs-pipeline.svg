    <rect x="14" y="14" width="32" height="20" rx="6" fill="#7c2d12" />
    <text x="30" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#fdba74" text-anchor="middle">BOX 2</text>
    <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Day 2</text>
    <text x="14" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Short Interval</text>
    <text x="14" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f97316">Reinforcement</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M370 85 L390 85 M385 79 L391 85 L385 91" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

