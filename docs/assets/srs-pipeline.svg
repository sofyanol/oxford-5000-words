    <rect x="14" y="14" width="32" height="20" rx="6" fill="#1e3a8a" />
    <text x="30" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#93c5fd" text-anchor="middle">BOX 4</text>
    <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Day 7</text>
