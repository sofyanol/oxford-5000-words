<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" fill="none">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#d9a441" flood-opacity="0.18" />
    </filter>
    <filter id="floatShadow" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffefb" />
      <stop offset="100%" stop-color="#fbf7ec" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Central Flashcard (Transparent Canvas Background) -->
  <g transform="translate(240, 50)" filter="url(#cardShadow)">
    <!-- Card Frame -->
    <rect width="480" height="420" rx="26" fill="url(#cardGrad)" stroke="#e8dcc4" stroke-width="1.5" />
    
    <!-- Top Bar Inside Card -->
    <rect x="24" y="22" width="46" height="26" rx="8" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-opacity="0.3" />
    <text x="47" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">B2</text>
    
    <text x="456" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#9ca3af" text-anchor="end">1,428 / 5,325</text>

    <!-- Main Headword -->
    <text x="240" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="-0.5">acceptable</text>
    
    <!-- Phonetics & Audio Controls -->
    <g transform="translate(110, 134)">
      <!-- Speed Pill -->
      <rect x="0" y="0" width="50" height="30" rx="8" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="25" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">1.0x</text>

      <!-- US Audio Pill -->
      <rect x="60" y="0" width="95" height="30" rx="8" fill="#e0f2fe" stroke="#7dd3fc" />
      <text x="107" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">🔊 US /əkˈs.../</text>

      <!-- UK Audio Pill -->
      <rect x="165" y="0" width="95" height="30" rx="8" fill="#ecfdf5" stroke="#6ee7b7" />
      <text x="212" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">🔊 UK /əkˈs.../</text>
    </g>

    <!-- Tag & Translation -->
    <g transform="translate(160, 182)">
      <rect x="0" y="0" width="56" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="28" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">adjective</text>
      
      <rect x="66" y="0" width="94" height="24" rx="6" fill="#fef3c7" stroke="#fcd34d" />
      <text x="113" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">مقبول • Aceptable</text>
    </g>

    <!-- Example Sentence Container -->
    <g transform="translate(24, 226)">
      <rect width="432" height="92" rx="14" fill="#ffffff" stroke="#e2e8f0" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">EXAMPLE SENTENCE</text>
      <text x="18" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#1e293b">Let's find a solution that is <tspan font-weight="800" fill="#d97706">acceptable</tspan> to everyone.</text>
      <text x="18" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#64748b">دعونا نجد حلاً يكون مقبولاً للجميع.</text>
    </g>

    <!-- Word Inflections / Forms -->
    <g transform="translate(24, 332)">
      <rect width="432" height="64" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="18" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b">WORD FORMS &amp; COMPARATIVES</text>
      <text x="18" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155">Comparative: <tspan font-weight="700" fill="#0f172a">more acceptable</tspan> • Superlative: <tspan font-weight="700" fill="#0f172a">most acceptable</tspan></text>
    </g>
  </g>

  <!-- Floating Left Button: Know ✓ -->
  <g transform="translate(90, 240)" filter="url(#floatShadow)">
    <circle cx="45" cy="45" r="42" fill="url(#tealGrad)" stroke="#ffffff" stroke-width="3" />
    <path d="M32 45 L41 54 L58 35" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="-10" y="98" width="110" height="28" rx="8" fill="#065f46" />
    <text x="45" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">I KNOW IT ✓</text>
  </g>

  <!-- Floating Right Button: Don't Know ✕ -->
  <g transform="translate(785, 240)" filter="url(#floatShadow)">
    <circle cx="45" cy="45" r="42" fill="url(#coralGrad)" stroke="#ffffff" stroke-width="3" />
    <path d="M34 34 L56 56 M56 34 L34 56" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <rect x="-10" y="98" width="110" height="28" rx="8" fill="#991b1b" />
    <text x="45" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">STILL LEARNING ✕</text>
  </g>

  <!-- Top Floating Badge: Streak Counter -->
  <g transform="translate(730, 25)" filter="url(#floatShadow)">
    <rect width="180" height="48" rx="14" fill="url(#pillGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="24" y="32" font-size="22">🔥</text>
    <text x="56" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">DAILY STREAK</text>
    <text x="56" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff">14 Days Active</text>
  </g>

  <!-- Top Floating Badge: CEFR Mastery -->
  <g transform="translate(50, 25)" filter="url(#floatShadow)">
    <rect width="210" height="48" rx="14" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="32" font-size="20">🎓</text>
    <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#7dd3fc">CEFR COVERAGE</text>
    <text x="50" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff">A1 • A2 • B1 • B2 • C1</text>
  </g>

  <!-- Bottom Floating Badges: Features Grid -->
  <g transform="translate(160, 485)" filter="url(#floatShadow)">
    <!-- Quiz Badge -->
    <rect x="0" y="0" width="145" height="44" rx="12" fill="url(#pillGrad)" stroke="#a855f7" stroke-width="1.5" />
    <text x="20" y="28" font-size="16">📝</text>
    <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#e9d5ff">4 Quiz Modes</text>

    <!-- Word Match Badge -->
    <rect x="165" y="0" width="155" height="44" rx="12" fill="url(#pillGrad)" stroke="#10b981" stroke-width="1.5" />
    <text x="185" y="28" font-size="16">🧩</text>
    <text x="209" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#a7f3d0">Word Match Game</text>

    <!-- Dual Audio Badge -->
    <rect x="340" y="0" width="155" height="44" rx="12" fill="url(#pillGrad)" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="360" y="28" font-size="16">🔊</text>
    <text x="384" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#bae6fd">10,460 MP3 Audio</text>

    <!-- Offline First Badge -->
    <rect x="515" y="0" width="135" height="44" rx="12" fill="url(#pillGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="535" y="28" font-size="16">⚡</text>
    <text x="559" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#fde68a">100% Offline</text>
  </g>
</svg>
