<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%" fill="none">
  <defs>
    <!-- Ambient Background Glows -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>

    <!-- Card 3D Depth Shadow -->
    <filter id="card3DShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.2" />
    </filter>

    <!-- Floating Badge Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10b981" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.35" />
    </filter>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>

    <!-- Mesh Gradients -->
    <radialGradient id="meshEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Modal Background Gradient (Luxury Slate / Dark Glass) -->
    <linearGradient id="modalBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <!-- Side Panel Background Gradient -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Button & Pill Gradients -->
    <linearGradient id="btnGoogle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="btnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="syncPillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Glows -->
  <g opacity="0.9">
    <circle cx="260" cy="220" r="220" fill="url(#meshEmerald)" filter="url(#ambientGlow)" />
    <circle cx="720" cy="200" r="200" fill="url(#meshCyan)" filter="url(#ambientGlow)" />
    <circle cx="500" cy="380" r="160" fill="url(#meshAmber)" filter="url(#ambientGlow)" />
  </g>

  <!-- ================= LEFT SIDE: AUTH & CLOUD SYNC DIALOG MOCKUP ================= -->
  <g transform="translate(42, 28)" filter="url(#card3DShadow)">
    <!-- Modal Container -->
    <rect width="470" height="384" rx="24" fill="url(#modalBg)" stroke="url(#accentBorder)" stroke-width="1.5" />

    <!-- Top Neon Accent Glow Line -->
    <rect x="36" y="0" width="398" height="3" rx="1.5" fill="#10b981" />

    <!-- Header & Title -->
    <g transform="translate(32, 28)">
      <circle cx="20" cy="18" r="18" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
      <text x="20" y="24" font-size="16" text-anchor="middle">☁️</text>
      <text x="50" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#ffffff">Cloud Account Sync</text>
      <text x="50" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Instant Cross-Device Progress Synchronization</text>
    </g>

    <!-- Top Tab Switcher -->
    <g transform="translate(32, 78)">
      <rect width="406" height="38" rx="10" fill="#0f172a" stroke="#334155" />
      <!-- Active Tab: Cloud Account -->
      <rect x="3" y="3" width="198" height="32" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="102" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle">☁️ Cloud Account (Active)</text>
      <!-- Inactive Tab: Manual Offline Sync -->
      <text x="304" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">🔗 Offline Link Sync</text>
    </g>

    <!-- Google One-Tap Sign In Button -->
    <g transform="translate(32, 132)" filter="url(#emeraldGlow)">
      <rect width="406" height="46" rx="12" fill="url(#btnGoogle)" stroke="#cbd5e1" stroke-width="1" />
      <!-- Google 'G' Logo SVG -->
      <g transform="translate(112, 13)">
        <path fill="#4285F4" d="M19.6 10.23c0-.82-.07-1.42-.25-2.05H10v3.72h5.5c-.15.96-.74 2.31-2.04 3.22v2.45h3.16c1.89-1.73 2.98-4.3 2.98-7.34z"/>
        <path fill="#34A853" d="M10 20c2.7 0 4.96-.89 6.62-2.42l-3.16-2.45c-.88.6-2.02.99-3.46.99-2.68 0-4.96-1.8-5.76-4.27H1.01v2.53C2.7 17.72 6.07 20 10 20z"/>
        <path fill="#FBBC05" d="M4.24 11.85c-.21-.6-.33-1.24-.33-1.85s.12-1.25.33-1.85V5.62H1.01C.37 6.9.01 8.35.01 10s.36 3.1.99 4.38l3.24-2.53z"/>
        <path fill="#EA4335" d="M10 3.88c1.88 0 3.13.81 3.85 1.48l2.82-2.76C14.96.99 12.7 0 10 0 6.07 0 2.7 2.28 1.01 5.62l3.23 2.53c.8-2.47 3.08-4.27 5.76-4.27z"/>
      </g>
      <text x="146" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#1e293b">Continue with Google</text>
    </g>

    <!-- Divider: Or with Email -->
    <g transform="translate(32, 194)">
      <line x1="0" y1="0" x2="140" y2="0" stroke="#334155" stroke-dasharray="3 3" />
      <text x="203" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">OR WITH EMAIL &amp; PASSWORD</text>
      <line x1="266" y1="0" x2="406" y2="0" stroke="#334155" stroke-dasharray="3 3" />
    </g>

    <!-- Sleek Input Field 1: Email -->
    <g transform="translate(32, 212)">
      <rect width="406" height="38" rx="10" fill="#0f172a" stroke="#334155" />
      <text x="16" y="24" font-size="14">✉️</text>
      <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">learner@example.com (Your Email)</text>
    </g>

    <!-- Sleek Input Field 2: Password -->
    <g transform="translate(32, 258)">
      <rect width="406" height="38" rx="10" fill="#0f172a" stroke="#334155" />
      <text x="16" y="24" font-size="14">🔒</text>
      <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">•••••••••••••••• (Secret Password)</text>
    </g>

    <!-- Action Buttons: Sign In / Create Account -->
    <g transform="translate(32, 308)">
      <!-- Sign In Button (Gold) -->
      <g filter="url(#amberGlow)">
        <rect width="196" height="40" rx="10" fill="url(#btnGold)" stroke="#f59e0b" stroke-width="1" />
        <text x="98" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">🔑 Sign In to Cloud</text>
      </g>
      <!-- Create Account Button -->
      <g transform="translate(210, 0)">
        <rect width="196" height="40" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="98" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#e2e8f0" text-anchor="middle">✨ Create Account</text>
      </g>
    </g>

    <!-- Bottom Status Live Indicator -->
    <g transform="translate(32, 360)">
      <circle cx="6" cy="0" r="4" fill="#10b981" />
      <text x="18" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">🟢 100% Cloud Synced &amp; Encrypted • 5,325 Words &amp; Streak Protected</text>
    </g>
  </g>

  <!-- ================= RIGHT SIDE: MULTI-DEVICE ECOSYSTEM ================= -->
  <g transform="translate(540, 28)">
    <!-- Right Panel Card -->
    <rect width="398" height="384" rx="24" fill="url(#panelBg)" stroke="#334155" stroke-width="1.2" />
    <rect x="30" y="0" width="338" height="3" rx="1.5" fill="#06b6d4" />

    <!-- Section Header -->
    <g transform="translate(24, 28)">
      <rect width="138" height="24" rx="12" fill="#0e7490" fill-opacity="0.3" stroke="#06b6d4" stroke-width="1" />
      <text x="69" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#22d3ee" text-anchor="middle">MULTI-DEVICE CLOUD</text>
      <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff">One Account, Every Screen</text>
      <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Study seamlessly across mobile, tablet, and desktop</text>
    </g>

    <!-- Multi-Device Visual Illustration -->
    <g transform="translate(24, 110)">
      <!-- Desktop Mockup Frame -->
      <g transform="translate(0, 0)">
        <rect width="210" height="135" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
        <rect x="0" y="0" width="210" height="18" rx="12" fill="#1e293b" />
        <circle cx="12" cy="9" r="3" fill="#ef4444" />
        <circle cx="20" cy="9" r="3" fill="#f59e0b" />
        <circle cx="28" cy="9" r="3" fill="#10b981" />
        <rect x="42" y="4" width="126" height="10" rx="4" fill="#334155" />
        
        <!-- Screen Content Mini -->
        <text x="105" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#fbbf24" text-anchor="middle">acceptable</text>
        <rect x="65" y="54" width="80" height="12" rx="4" fill="#334155" />
        <rect x="35" y="74" width="140" height="18" rx="6" fill="#064e3b" stroke="#10b981" />
        <text x="105" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#a7f3d0" text-anchor="middle">🟢 Mastered (Stage 5)</text>
        <!-- Stand -->
        <rect x="95" y="135" width="20" height="14" fill="#334155" />
        <rect x="80" y="147" width="50" height="5" rx="2" fill="#475569" />
      </g>

      <!-- Sync Bi-directional Rays & Cloud Center -->
      <g transform="translate(216, 42)">
        <circle cx="26" cy="26" r="24" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#emeraldGlow)" />
        <text x="26" y="33" font-size="18" text-anchor="middle">☁️</text>
        <!-- Arrows -->
        <path d="M-8 20 L2 20 M-2 16 L3 20 L-2 24" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
        <path d="M60 32 L50 32 M54 28 L49 32 L54 36" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" fill="none" />
      </g>

      <!-- Mobile Phone Mockup Frame -->
      <g transform="translate(272, 8)">
        <rect width="78" height="142" rx="16" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
        <!-- Dynamic Island / Notch -->
        <rect x="25" y="5" width="28" height="5" rx="2.5" fill="#334155" />
        <!-- Screen Content Mini -->
        <text x="39" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#fbbf24" text-anchor="middle">acceptable</text>
        <rect x="12" y="46" width="54" height="8" rx="3" fill="#1e293b" />
        <rect x="12" y="60" width="54" height="22" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
        <text x="39" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#a7f3d0" text-anchor="middle">🔥 14 Days</text>
        <rect x="14" y="92" width="50" height="14" rx="4" fill="#10b981" />
        <text x="39" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">I KNOW IT ✓</text>
        <!-- Home bar -->
        <rect x="27" y="132" width="24" height="3" rx="1.5" fill="#475569" />
      </g>
    </g>

    <!-- Feature Pillars List -->
    <g transform="translate(24, 276)">
      <!-- Pillar 1 -->
      <g transform="translate(0, 0)">
        <rect width="350" height="28" rx="8" fill="#0f172a" stroke="#1e293b" />
        <circle cx="16" cy="14" r="7" fill="#064e3b" />
        <text x="16" y="18" font-size="9" fill="#34d399" text-anchor="middle">✓</text>
        <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Zero-Knowledge Private Firestore Security Rules</text>
      </g>
      <!-- Pillar 2 -->
      <g transform="translate(0, 34)">
        <rect width="350" height="28" rx="8" fill="#0f172a" stroke="#1e293b" />
        <circle cx="16" cy="14" r="7" fill="#0e7490" />
        <text x="16" y="18" font-size="9" fill="#22d3ee" text-anchor="middle">✓</text>
        <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Automatic Background Sync Upon Answering Cards</text>
      </g>
      <!-- Pillar 3 -->
      <g transform="translate(0, 68)">
        <rect width="350" height="28" rx="8" fill="#0f172a" stroke="#1e293b" />
        <circle cx="16" cy="14" r="7" fill="#78350f" />
        <text x="16" y="18" font-size="9" fill="#fbbf24" text-anchor="middle">✓</text>
        <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">100% Offline-Resilient with LocalStorage Fallback</text>
      </g>
    </g>
  </g>
</svg>