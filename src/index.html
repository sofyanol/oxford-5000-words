<!DOCTYPE html>
<!--
  Oxford 5000 Words - Modern Single-File HTML Vocabulary Companion.
  ------------------------------------------------------------------
  Runs directly in any browser offline without servers or accounts.
  To run automated verification tests: append #selftest to the URL and open console (F12).
  Verify console logs: SELFTEST PASS.

  Source files:
    src/index.html   Markup structure
    src/styles.css   Styles and responsive layouts
    src/app.js       Application logic and event handlers
    data/            Words, examples, IPA, forms, and translations
  Build script:
    python build/build.py
  Output:
    dist/oxford5000-flashcards-final.html
-->
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="description" content="Oxford 5000 Words: a friendly offline-first English vocabulary app with CEFR levels, examples, IPA pronunciation, spaced repetition, and multiple-choice review.">
<meta name="theme-color" content="#10161f">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<meta property="og:type" content="website">
<meta property="og:title" content="Oxford 5000">
<meta property="og:description" content="Master a practical English vocabulary foundation with 4,954 Oxford 3000/5000 words, examples, pronunciation, spaced repetition, and quizzes.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Oxford 5000">
<meta name="twitter:description" content="A friendly offline-first English vocabulary app with Oxford 3000/5000 words, examples, pronunciation, spaced repetition, and quizzes.">
<meta name="apple-mobile-web-app-title" content="Oxford 5000">
<meta name="theme-color" content="#0c1017">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310161f'/%3E%3Ctext x='32' y='43' font-family='monospace' font-size='25' font-weight='700' fill='%23d9a441' text-anchor='middle'%3EO5%3C/text%3E%3C/svg%3E">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; media-src 'self' file: blob: data: http: https:; connect-src https://api.telegram.org https://abacus.jasoncameron.dev; base-uri 'none'; form-action 'none'; manifest-src 'self' data:;">
<title>Oxford 5000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700;800&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="storageWarning" role="alert">
  <span data-i18n="storage.warning"></span>
  <button type="button" id="warnDownload" data-i18n="toolbar.download"></button>
</div>

<div id="backupBanner" role="status">
  <span data-i18n="backup.banner"></span>
  <button type="button" id="backupNow" data-i18n="backup.now"></button>
  <button type="button" id="backupLater" data-i18n="backup.later"></button>
</div>

<div class="app">

  <header>
    <div class="brand">
      <span class="eyebrow">Oxford 5000</span>
      <h1 data-i18n="brand.title"></h1>
    </div>
    <div class="stats">
      <div class="lang-switch" data-i18n-title="lang.label">
        <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.6 2.4 4 5.6 4 9s-1.4 6.6-4 9c-2.6-2.4-4-5.6-4-9s1.4-6.6 4-9z"></path></svg>
        <button type="button" id="langSelectButton" class="lang-select-button" data-i18n-aria="lang.label" aria-haspopup="listbox" aria-expanded="false">
          <span id="langSelectLabel"></span>
        </button>
        <div id="langMenu" class="lang-menu" role="listbox" aria-multiselectable="true" hidden></div>
        <select id="langSelect" class="lang-select-native" data-i18n-aria="lang.label" tabindex="-1" aria-hidden="true"></select>
        <span class="lang-code" id="langCode">AR</span>
        <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
      <button type="button" class="stat-pill" id="openKnown" data-i18n-title="stat.known.title"><span class="dot know"></span><b id="knowCount">0</b></button>
      <button type="button" class="stat-pill" id="openUnknown" data-i18n-title="stat.unknown.title"><span class="dot unknow"></span><b id="unknowCount">0</b></button>
      <button type="button" class="stat-pill" id="openLeft" data-i18n-title="stat.left.title"><span class="dot left"></span><b id="leftCount">0</b></button>
      <button type="button" class="stat-pill habit-pill" id="openHabit" data-i18n-title="habit.goal"><span class="habit-flame">🔥</span><b id="habitStreakCount">0</b><span class="habit-sep">·</span><span id="habitGoalProgress">0/20</span></button>
      <button type="button" class="link-btn" id="openSync" data-i18n="sync.button"></button>
    </div>
  </header>

  <div class="level-bar" id="levelBar"></div>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div id="mainArea">
  <aside id="examplesNotice" class="examples-notice" role="note" aria-live="polite">
    <span class="notice-icon" aria-hidden="true">💡</span>
    <span class="notice-text" data-i18n="card.examples_notice"></span>
    <button type="button" class="notice-close" id="closeExamplesNotice" data-i18n-aria="modal.close" data-i18n-title="modal.close" aria-label="Close">✕</button>
  </aside>
  <div class="deck" id="deck">
    <div class="ghost-card g2"></div>
    <div class="ghost-card g1"></div>
    <div class="card" id="card">
      <div class="hole"></div>
      <div class="swipe-badge know" id="badgeKnow" data-i18n="card.know"></div>
      <div class="swipe-badge unknow" id="badgeUnknow" data-i18n="card.unknow"></div>

      <div class="card-top">
        <span id="wordPos">1 / 0</span>
        <span class="lvl-badge" id="lvlBadge">A1</span>
      </div>

      <div class="word-head">
        <div class="the-word word-font" id="theWord" lang="en">
          word
          <span class="copy-toast" id="copyToast" data-i18n="card.copied"></span>
        </div>
        <div class="word-audio-group" id="wordAudioGroup">
          <button type="button" class="audio-btn audio-uk" id="btnAudioUk" aria-label="Play British pronunciation" title="UK Pronunciation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <span>UK</span>
          </button>
          <button type="button" class="audio-btn audio-us" id="btnAudioUs" aria-label="Play American pronunciation" title="US Pronunciation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <span>US</span>
          </button>
          <button type="button" class="audio-speed-btn" id="btnAudioSpeed" data-i18n-title="audio.speed" aria-label="Audio playback speed">
            <span id="audioSpeedLabel">1.0x</span>
          </button>
        </div>
        <div class="word-meta">
          <span class="pos-badge" id="cardPos"></span>
          <span class="cat-ar" id="cardCatAr"></span>
          <span class="custom-badge" id="cardCustomBadge" data-i18n="edit.customBadge" hidden></span>
          <span class="ipa" id="cardIpa" dir="ltr" hidden></span>
          <button type="button" class="card-edit-btn" id="btnEditCard" data-i18n-title="edit.button" data-i18n-aria="edit.button" title="Edit">✏️</button>
          <button type="button" class="speak-btn" id="speakMain" data-i18n-title="card.speak.title" data-i18n-aria="card.speak.title" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></button>
        </div>
        <div class="word-sense" id="cardSense" hidden></div>
        <div class="word-tr" id="cardTranslation" dir="auto" hidden></div>
      </div>

      <div class="example-card" id="cardSentence" hidden>
        <div class="example-head">
          <span class="sent-label" data-i18n="card.example"></span>
          <button type="button" class="sent-edit-btn" id="btnEditExample" data-i18n-title="edit.example" data-i18n-aria="edit.example" title="Edit example">✏️</button>
        </div>
        <div class="sent-text" id="cardSentenceText" dir="ltr"></div>
        <div class="sent-tr" id="cardSentenceTr" dir="auto" hidden></div>
      </div>

      <div class="forms-bar" id="formsBar" hidden></div>

      <details class="legend" id="legendBox">
        <summary data-i18n="legend.title"></summary>
        <div class="legend-rows">
          <div class="legend-row"><span class="legend-swatch base"></span><span data-i18n="legend.base"></span></div>
          <div class="legend-row"><span class="legend-swatch reg"></span><span data-i18n="legend.regular"></span></div>
          <div class="legend-row"><span class="legend-swatch irr"></span><span data-i18n="legend.irregular"></span></div>
          <div class="legend-row"><span class="legend-swatch tr"></span><span data-i18n="legend.translation"></span></div>
        </div>
      </details>

      <div class="translation-box">
        <textarea class="translation-input" id="translationInput" rows="2" dir="auto" data-i18n-placeholder="card.note.placeholder"></textarea>
      </div>

      <div class="hint-row">
        <span><span class="arrow">←</span> <span data-i18n="card.know"></span></span>
        <span><span data-i18n="card.unknow"></span> <span class="arrow">→</span></span>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="btnUnknow">
      <span class="circle unknow">✕</span>
      <span class="label" data-i18n="card.unknow"></span>
    </button>
    <button class="ctrl-btn" id="btnUndo">
      <span class="circle undo">↺</span>
      <span class="label" data-i18n="card.undo"></span>
    </button>
    <button class="ctrl-btn" id="btnKnow">
      <span class="circle know">✓</span>
      <span class="label" data-i18n="card.know"></span>
    </button>
  </div>

  <div class="toolbar">
    <button class="tool-btn primary" id="btnQuiz" data-i18n="quiz.button"></button>
    <button class="tool-btn" id="btnMatch" data-i18n="match.button"></button>
    <button class="tool-btn" id="btnAnalytics" data-i18n="analytics.button"></button>
    <button class="tool-btn" id="btnSearch" data-i18n="search.button"></button>
    <button class="tool-btn" id="btnSync" data-i18n="sync.button"></button>
    <button class="tool-btn" id="btnShuffle"></button>
    <button class="tool-btn" id="btnReset" data-i18n="toolbar.reset"></button>
    <button class="tool-btn primary" id="btnDownload" data-i18n="toolbar.download"></button>
  </div>
  </div>

  <aside class="side-tools" aria-label="Helpful tools">
    <button type="button" class="side-tool" id="openSettings" data-i18n="settings.button"></button>
    <button type="button" class="side-tool" id="openTutorial" data-i18n="tutorial.button"></button>
    <button type="button" class="side-tool" id="openFeedback" data-i18n="feedback.button"></button>
  </aside>

  <p class="due-line" id="dueLine" hidden></p>

  <footer class="note">
    <span data-i18n="footer.note.1"></span><br>
    <span data-i18n="footer.note.2"></span>
    <div class="follow-links">
      <span class="follow-label" data-i18n="footer.follow"></span>
      <span class="follow-arrow" aria-hidden="true">↓</span>
      <a class="social-icon linkedin-icon" href="https://www.linkedin.com/in/5ofian/" target="_blank" rel="noopener noreferrer" data-i18n-title="footer.linkedin" data-i18n-aria="footer.linkedin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.2 8.1H3.4V20h2.8V8.1ZM4.8 3A1.7 1.7 0 1 0 4.8 6.4 1.7 1.7 0 0 0 4.8 3ZM20.6 13.2c0-3.6-1.9-5.3-4.5-5.3-2.1 0-3 1.2-3.5 2v-1.8H9.8V20h2.8v-6.6c0-1.8.3-3.5 2.5-3.5 2.1 0 2.1 2 2.1 3.6V20h2.8l.6-6.8Z"></path></svg>
      </a>
      <a class="social-icon x-icon" href="https://x.com/5ofian_" target="_blank" rel="noopener noreferrer" data-i18n-title="footer.x" data-i18n-aria="footer.x">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4.2l3.3 4.7L16.5 4H19l-5.3 6.1L19.5 20h-4.2l-3.8-5.3L6.8 20H4.3l5.5-6.4L5 4Zm3.1 2.2 8.3 11.6h1.2L9.3 6.2H8.1Z"></path></svg>
      </a>
      <a class="social-icon github-icon" href="https://github.com/sofyanol" target="_blank" rel="noopener noreferrer" data-i18n-title="footer.github" data-i18n-aria="footer.github">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path></svg>
      </a>
    </div>
    <a class="coffee-support" href="https://www.paypal.com/ncp/payment/HZXA4F94TEA2A" target="_blank" rel="noopener noreferrer" data-i18n-title="footer.coffee" data-i18n-aria="footer.coffee">
      <span class="coffee-cup" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 8h13v5.5A5.5 5.5 0 0 1 11.5 19h-2A5.5 5.5 0 0 1 4 13.5V8Zm13 2h1.5a3.5 3.5 0 0 1 0 7H17v-2h1.5a1.5 1.5 0 0 0 0-3H17v-2ZM2 20h17v2H2v-2ZM7 2h2v4H7V2Zm4 0h2v4h-2V2Z"/></svg>
      </span>
      <span data-i18n="footer.coffee"></span>
    </a>
    <button type="button" class="whats-new-floating-badge" id="whatsNewBadge" data-i18n-title="whatsnew.title" aria-label="What's New">
      <span class="whats-new-icon-circle" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2h7.6l-6.1 4.5 2.3 7.3-6.2-4.6-6.2 4.6 2.3-7.3-6.1-4.5h7.6z"/></svg>
      </span>
      <span class="star-badge-text" data-i18n="whatsnew.badge">What's New?</span>
    </button>
    <div class="visitor-counter" aria-live="polite">
      <span data-i18n="visitor.label"></span>: <strong id="visitorCount" data-i18n="visitor.loading"></strong>
    </div>
  </footer>

</div>

<div class="overlay" id="tutorialOverlay">
  <div class="review-panel tutorial-panel" role="dialog" aria-modal="true" aria-labelledby="tutorialTitle" tabindex="-1">
    <div class="review-head">
      <div class="review-head-titles"><h3 id="tutorialTitle" data-i18n="tutorial.title"></h3></div>
      <button class="review-close" id="closeTutorial" type="button" data-i18n-aria="modal.close" data-i18n-title="modal.close">✕</button>
    </div>
    <p class="tutorial-intro" data-i18n="tutorial.intro"></p>
    <div class="tutorial-progress" id="tutorialProgress"></div>
    <nav class="tutorial-categories" id="tutorialCategories" aria-label="Tutorial sections"></nav>
    <div id="tutorialSteps" class="tutorial-steps"></div>
    <div class="tutorial-actions">
      <button class="tool-btn" id="tutorialPrevious" type="button" data-i18n="tutorial.previous"></button>
      <button class="tool-btn primary" id="tutorialNext" type="button" data-i18n="tutorial.next"></button>
    </div>
  </div>
</div>

<div class="overlay" id="formsGuideOverlay">
  <div class="review-panel forms-guide-panel" role="dialog" aria-modal="true" aria-labelledby="formsGuideTitle" tabindex="-1">
    <div class="review-head">
      <div class="review-head-titles"><h3 id="formsGuideTitle" data-i18n="forms.guide.title"></h3></div>
      <button class="review-close" id="closeFormsGuide" type="button" data-i18n-aria="modal.close" data-i18n-title="modal.close">✕</button>
    </div>
    <div id="formsGuideContent"></div>
  </div>
</div>

<div class="overlay" id="feedbackOverlay">
  <div class="review-panel feedback-panel" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle" tabindex="-1">
    <div class="review-head">
      <div class="review-head-titles"><h3 id="feedbackTitle" data-i18n="feedback.title"></h3></div>
      <button class="review-close" id="closeFeedback" type="button" data-i18n-aria="modal.close" data-i18n-title="modal.close">✕</button>
    </div>
    <textarea id="feedbackInput" class="feedback-input" rows="6" data-i18n-placeholder="feedback.placeholder"></textarea>
    <p class="feedback-note" data-i18n="feedback.note"></p>
    <p class="feedback-status" id="feedbackStatus" aria-live="polite"></p>
    <button class="tool-btn primary" id="submitFeedback" type="button" data-i18n="feedback.open"></button>
  </div>
</div>

<div class="overlay" id="onboardingOverlay">
  <div class="review-panel onboarding-panel" role="dialog" aria-modal="true" aria-labelledby="onboardingTitle" tabindex="-1">
    <div class="review-head">
      <div class="review-head-titles">
        <h3 id="onboardingTitle" data-i18n="onboarding.title"></h3>
      </div>
      <button class="review-close" id="closeOnboarding" type="button" data-i18n-aria="modal.close" data-i18n-title="modal.close">✕</button>
    </div>
    <div class="onboarding-body">
      <section>
        <h4 data-i18n="onboarding.level.title"></h4>
        <p data-i18n="onboarding.level.text"></p>
      </section>
      <section>
        <h4 data-i18n="onboarding.srs.title"></h4>
        <p data-i18n="onboarding.srs.text"></p>
      </section>
      <button class="tool-btn primary" id="startOnboarding" type="button" data-i18n="onboarding.start"></button>
    </div>
  </div>
</div>

<div class="overlay" id="reviewOverlay">
  <div class="review-panel" role="dialog" aria-modal="true" aria-labelledby="reviewTitle" tabindex="-1">
    <div class="review-head">
      <div class="review-head-titles">
        <h3 id="reviewTitle" data-i18n="modal.unknown.title"></h3>
        <span class="review-count" id="reviewCount">0</span>
      </div>
      <button class="review-close" id="closeReview" type="button" data-i18n-aria="modal.close" data-i18n-title="modal.close">✕</button>
    </div>
    <div class="review-controls-wrap">
      <select class="review-sort" id="reviewSort" data-i18n-aria="modal.sort.aria">
        <option value="level_asc" data-i18n="modal.sort.level_asc"></option>
        <option value="level_desc" data-i18n="modal.sort.level_desc"></option>
        <option value="alpha_asc" data-i18n="modal.sort.alpha_asc"></option>
        <option value="alpha_desc" data-i18n="modal.sort.alpha_desc"></option>
      </select>
      <input class="review-search" id="reviewSearch" type="text" dir="auto" data-i18n-placeholder="modal.search.placeholder" data-i18n-aria="modal.search.placeholder">
    </div>
    <div class="review-summary" id="reviewSummary"></div>
    <div class="review-list" id="reviewList"></div>
    <div class="review-footer">
      <button class="review-clear" id="btnClearAll" data-i18n="modal.clear"></button>
      <button class="tool-btn primary" id="btnQuizFromList" style="display:none;" data-i18n="quiz.button"></button>
      <button class="tool-btn" id="btnExportAnki" data-i18n="export.anki" data-i18n-title="export.anki.title"></button>
      <button class="tool-btn primary" id="btnDownloadFromReview" data-i18n="modal.download"></button>
    </div>
  </div>
</div>

<div class="overlay" id="syncOverlay">
  <div class="review-panel sync-panel" role="dialog" aria-modal="true" aria-labelledby="syncTitle" tabindex="-1">
    <div class="review-head">
      <div class="review-head-titles">
        <h3 id="syncTitle" data-i18n="sync.title"></h3>
      </div>
      <button class="review-close" id="closeSync" type="button" data-i18n-aria="modal.close" data-i18n-title="modal.close">✕</button>
    </div>
    <div class="sync-body">
      <section class="sync-section sync-quick">
        <h4 data-i18n="sync.quick.heading"></h4>
        <p class="sync-note" data-i18n="sync.quick.explain"></p>
        <div class="sync-actions">
          <button class="tool-btn primary" id="btnMakeLink" type="button" data-i18n="sync.quick.make"></button>
          <button class="tool-btn" id="btnUpdateLink" type="button" data-i18n="sync.quick.update"></button>
          <button class="tool-btn" id="btnShareLink" type="button" data-i18n="sync.quick.share"></button>
          <button class="tool-btn" id="btnPasteMerge" type="button" data-i18n="sync.quick.paste"></button>
        </div>

<div class="overlay" id="searchOverlay">

        <button type="button" class="explorer-chip" data-filter-level="a2">A2</button>
        <button type="button" class="explorer-chip" data-filter-level="b1">B1</button>
        <button type="button" class="explorer-chip" data-filter-level="b2">B2</button>
        <button type="button" class="explorer-chip" data-filter-level="c1">C1</button>

      <div class="explorer-filter-group" id="searchStatusFilters">
        <span class="filter-group-tag" data-i18n="search.statusTag"></span>
        <button type="button" class="explorer-chip active" data-filter-status="all" data-i18n="search.filterAll"></button>
        <button type="button" class="explorer-chip chip-unknown" data-filter-status="u" data-i18n="search.status.u"></button>
        <button type="button" class="explorer-chip chip-due" data-filter-status="due" data-i18n="quiz.source.due"></button>
        <button type="button" class="explorer-chip chip-known" data-filter-status="k" data-i18n="search.status.k"></button>
        <button type="button" class="explorer-chip chip-new" data-filter-status="r" data-i18n="search.status.r"></button>

      <div class="explorer-filter-group" id="searchPosFilters">
        <span class="filter-group-tag" data-i18n="search.posTag"></span>

        <button type="button" class="explorer-chip" data-filter-pos="verb" data-i18n="search.filterVerbs"></button>
        <button type="button" class="explorer-chip" data-filter-pos="noun" data-i18n="search.filterNouns"></button>
        <button type="button" class="explorer-chip" data-filter-pos="adj" data-i18n="search.filterAdjectives"></button>
        <button type="button" class="explorer-chip" data-filter-pos="other" data-i18n="search.filterOthers"></button>

</div>

      </div>
      <div class="quiz-field" style="margin:14px 0;">

      <div class="quiz-field" style="margin:14px 0 18px;">

      <div class="edit-actions" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
